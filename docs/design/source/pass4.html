  del:'<path d="M20 6H9L3 12l6 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM12 10l5 4M17 10l-5 4"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>'
};
const svg = (n, cls='ic') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

function seal({spent=0.368, mode='dial', p=0, ticks=true, ghost=false}) {
  const R=126, beads=48, C=2*Math.PI*104;
  let b=''; for(let i=0;i<beads;i++){const a=i/beads*Math.PI*2;
    b+=`<circle cx="${131+Math.cos(a)*R}" cy="${131+Math.sin(a)*R}" r="5" fill="${mode==='sealed'?'var(--accent)':'var(--ground)'}" stroke="${mode==='sealed'?'rgba(255,255,255,.35)':'var(--rule)'}" stroke-width="1"/>`;}
  let t=''; if(ticks && mode!=='sealed'){const on=Math.round(spent*60);
    for(let i=0;i<60;i++){const a=(i/60)*Math.PI*2-Math.PI/2,r1=90,r2=i%5===0?98:95;
      t+=`<line x1="${131+Math.cos(a)*r1}" y1="${131+Math.sin(a)*r1}" x2="${131+Math.cos(a)*r2}" y2="${131+Math.sin(a)*r2}" stroke="${i<on&&mode==='dial'?'var(--ink)':'var(--ink3)'}" stroke-opacity="${i<on&&mode==='dial'?.9:.55}" stroke-width="${i%5===0?1.6:1}"/>`;}}
  const frac = mode==='dial'?spent : mode==='press'?p : mode==='sealed'?1 : 0;
  const track = mode==='sealed' ? '' : `<circle cx="131" cy="131" r="104" fill="none" stroke="var(--wax-tint)" stroke-width="10" ${mode==='rest'?'stroke-dasharray="3 6"':''}/>`;
  const arc = (mode==='sealed'||frac<=0) ? '' : `<circle cx="131" cy="131" r="104" fill="none" stroke="var(--accent)" stroke-width="10" stroke-dasharray="${(C*frac).toFixed(1)} ${(C*(1-frac)+1).toFixed(1)}" transform="rotate(-90 131 131)"/>`;
  const disc = mode==='sealed'
    ? `<circle cx="131" cy="131" r="126" fill="var(--accent)"/><circle cx="131" cy="131" r="104" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/><circle cx="131" cy="131" r="97" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="1"/>`
    : `<circle cx="131" cy="131" r="126" fill="var(--raised)" stroke="var(--rule)" stroke-width="1"/>`;
  const inner = mode==='sealed' ? '' : `<circle cx="131" cy="131" r="88" fill="none" stroke="var(--rule)" stroke-width="1"/>`;
  const gm = ghost ? `<path d="M92 166V100l39 43 39-43v66" fill="none" stroke="var(--wax-tint)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>` : '';
  return `<svg viewBox="0 0 262 262" aria-hidden="true"><g filter="url(#emb)">${disc}</g>${b}${t}${track}${arc}${inner}${gm}</svg>`;
}
// small dial for lists: ring only (no beads), so it stays readable at 52px
function dial(frac, paused=false) {
  const C=2*Math.PI*21;
  return `<div class="minidial"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="21" fill="none" stroke="${paused?'var(--rule)':'var(--wax-tint)'}" stroke-width="6"/>${paused?'':`<circle cx="26" cy="26" r="21" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 26 26)"/>`}${paused?'<rect x="19" y="18" width="4.5" height="16" rx="1.6" fill="var(--ink3)"/><rect x="28.5" y="18" width="4.5" height="16" rx="1.6" fill="var(--ink3)"/>':'<circle cx="26" cy="26" r="9" fill="none" stroke="var(--rule)" stroke-width="1"/>'}</svg></div>`;
}

        : `<circle cx="20" cy="20" r="11" fill="var(--accent)"/><circle cx="20" cy="20" r="7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/><path d="M16 24v-8l4 4.5 4-4.5v8" fill="none" stroke="#F4F6F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg class="tok" viewBox="0 0 40 40" aria-hidden="true">${bg}${m}</svg>`;
}

// ---------- sample QR (decorative; labelled sample data) ----------
function qr(n=29, m=8) {
  let s=7, rnd=()=> (s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff, out='';
  const inFinder=(x,y)=> (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ if(inFinder(x,y)) continue; if(rnd()>.52) out+=`<rect x="${x*m}" y="${y*m}" width="${m}" height="${m}"/>`; }
  const f=(x,y)=>`<rect x="${x*m}" y="${y*m}" width="${7*m}" height="${7*m}" fill="#14191C"/><rect x="${(x+1)*m}" y="${(y+1)*m}" width="${5*m}" height="${5*m}" fill="#fff"/><rect x="${(x+2)*m}" y="${(y+2)*m}" width="${3*m}" height="${3*m}" fill="#14191C"/>`;
  return `<svg viewBox="0 0 ${n*m} ${n*m}" width="240" height="240" shape-rendering="crispEdges" aria-hidden="true"><g fill="#14191C">${out}</g>${f(0,0)}${f(n-7,0)}${f(0,n-7)}</svg>`;
}
