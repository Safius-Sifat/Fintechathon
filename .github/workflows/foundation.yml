name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.8
          cache-dependency-path: |
            services/mpc-boundary/go.sum
            services/mpc-adapter/go.sum
            services/mpc-authorizer/go.sum
      - name: MPC boundary, adapter and authorizer (vet, race tests)
        run: |
          node scripts/fetch-mpcium.mjs
          test "$(git -C vendor/mpcium rev-parse HEAD)" = 90e3ee3c15e6698ade5626ff6c6b49d2453d8ce2
          for module in mpc-boundary mpc-adapter mpc-authorizer; do
            (cd "services/$module" && go vet ./... && go test -race -count=1 ./...)
          done
      - run: pnpm check:repository
      - run: pnpm typecheck
      - run: pnpm test:ops
      - run: pnpm test:release
      - run: pnpm test:migrations
      - run: pnpm --filter @mandate/api check
      - run: pnpm --filter @mandate/worker check
      - run: pnpm --filter @mandate/policy check
      - run: pnpm test:db
      - run: pnpm --filter @mandate/schema check
      - name: Contract tests and ABI sync
        run: |
          node scripts/check-suite.mjs forge packages/contracts 'test/**/*.t.sol'
          pnpm --filter @mandate/contracts abi:check
      - name: Build backend image
        run: |
          # Match the private umask used by the production release checkout.
          find apps/api packages/platform packages/schema -path '*/node_modules' -prune -o -type f -exec chmod 600 {} +
          docker build --tag mandate-ci .
      - name: Smoke-test backend container
        run: bash scripts/ops/container-smoke.sh mandate-ci
  deploy:
    name: Deploy tested main
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Contracts, addresses, database, backend and smoke test
        shell: bash
        env:
          VM_ID: ${{ vars.AZURE_APP_VM_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VM_ID" =~ /providers/Microsoft.Compute/virtualMachines/mandate-app- ]]
          # No shell interpolation from PR titles, branch names or user inputs.
          result=$(az vm run-command invoke --ids "$VM_ID" --command-id RunShellScript \
            --scripts "runuser -u mandate-deploy -- /opt/mandate/bin/deploy '$COMMIT'" --output json)
          # Run Command's provisioning success does not prove the script succeeded.
          printf '%s' "$result" > "$RUNNER_TEMP/mandate-result.json"
          node scripts/ops/run-command-result.mjs "$RUNNER_TEMP/mandate-result.json" "$COMMIT"
