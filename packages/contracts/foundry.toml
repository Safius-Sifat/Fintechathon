[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Golden vectors are read from the schema package (P1-01.T01).
fs_permissions = [{ access = "read", path = "../schema/fixtures" }]

[invariant]
runs = 64
depth = 64
fail_on_revert = false
