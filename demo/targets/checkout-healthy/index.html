<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .form-group { margin-bottom: 1rem; }
    .success { color: green; font-weight: bold; margin-top: 1rem; }
    .error { color: red; font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <form id="checkout-form">
    <div class="form-group">
      <label for="customer">Customer Name:</label>
      <input type="text" id="customer" name="customer" value="Alice" required />
    </div>
    <div class="form-group">
      <label for="item">Item:</label>
      <input type="text" id="item" name="item" value="Subscription Plan A" required />
    </div>
    <div class="form-group">
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" value="1" required />
    </div>
    <button type="submit" id="submit-checkout">Confirm Checkout</button>
  </form>
  <div id="confirmation-status"></div>

  <script>
    document.getElementById("checkout-form").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("confirmation-status").innerHTML =
        '<div id="confirmation" class="success">Order Confirmed: #ORD-1001</div>';
    });
  </script>
</body>
</html>
