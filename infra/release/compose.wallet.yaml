name: mandate-app
services:
  api:
    image: ${MANDATE_IMAGE:?immutable local release image required}
    user: "10001:10001"
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    env_file: [/opt/mandate/private/runtime.env]
    environment:
      APP_ENV: production
      API_HOST: 127.0.0.1
      DEPLOYMENT_MANIFEST_FILE: /run/mandate/base-sepolia.json
      SOURCE_REVISION: ${MANDATE_COMMIT:?tested commit required}
    volumes:
      - ${MANDATE_MANIFEST:?manifest required}:/run/mandate/base-sepolia.json:ro
      - /opt/mandate/private/db-ca.crt:/run/db-ca.crt:ro
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
