name: mandate-dev
services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandate}
      POSTGRES_DB: ${POSTGRES_DB:-mandate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  nats:
    image: nats:2.11.9-alpine@sha256:777787bbb4c7c4083ec2213b0b8b14151617610a3e0d85776bd995cd46599c73
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--user", "${NATS_USER:-mandate}", "--pass", "${NATS_PASSWORD:?Run pnpm setup:env first}"]
    ports: ["127.0.0.1:4222:4222"]
    volumes: ["nats-data:/data"]
  consul:
    image: hashicorp/consul:1.21.5@sha256:6126c30072690cb3173a450ff5bde120c3a01e11c9dccab83b1b2314d4c828bd
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports: ["127.0.0.1:8500:8500"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
  nats-data:
